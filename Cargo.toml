[workspace]
members = [".", "crates/mermaid-text"]

[package]
name = "guniweb-md"
version = "0.1.0"
edition = "2024"
description = "Read and edit Markdown next to your coding agent: a terminal Markdown editor with hybrid live preview"
license = "MIT"
repository = "https://github.com/guniweb/guniweb-md"
keywords = ["markdown", "tui", "terminal", "viewer", "ratatui"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
# Screenshots are referenced from README.md via absolute GitHub raw URLs,
# so crates.io fetches them at render time. Excluding them from the
# tarball keeps `cargo install` downloads lean.
exclude = ["docs/screenshots/*"]

[[bin]]
name = "gmd"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
pulldown-cmark = "0.13"
ignore = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
notify-debouncer-mini = "0.7"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
dirs = "6.0.0"
mermaid-rs-renderer = "0.3.1"
ratatui-image = { version = "11.0.5", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false }
resvg = "0.47"
unicode-width = "0.2"
base64 = "0.22"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
edtui = { version = "0.11.2", default-features = false }
tempfile = "3.27.0"
mermaid-text = { version = "0.58.0", path = "crates/mermaid-text" }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
semver = "1.0.28"
serde_json = "1"
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
ratex-render = { version = "0.1.14", features = ["embed-fonts"] }

[dev-dependencies]
insta = "1"
httpmock = "0.8"
