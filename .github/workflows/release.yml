# Release workflow for guniweb-md.
#
# Triggered by `v*.*.*` tags. Builds the `gmd` binary for Linux and macOS and
# attaches the archives plus SHA256SUMS to a GitHub Release. Nothing is
# published to crates.io, Homebrew or AUR.
#
# Binaries are not signed or notarized.

name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.35.0) — used for manual back-fills"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Resolve the tag once at workflow level so every job uses the same value
  # regardless of trigger. Under `push` of a tag, github.ref_name is the
  # tag (e.g. "v1.34.38"). Under workflow_dispatch (manual back-fill),
  # github.ref_name is the branch ("master"), so we honour the user-supplied
  # `inputs.tag` instead. Without this, GITHUB_REF_NAME under workflow_dispatch
  # leaks "master" into VERSION extraction and the gh-release action dies
  # with `##[error]⚠️ GitHub Releases requires a tag`.
  RESOLVED_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RESOLVED_TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Build binary
        # `--package guniweb-md` builds only the `gmd` binary, not the
        # mermaid-text workspace member.
        #
        # `cross` handles cross-compilation for aarch64-unknown-linux-gnu
        # via a Docker image with the correct GCC cross-toolchain — no
        # manual linker setup required.
        run: cross build --release --target ${{ matrix.target }} --package guniweb-md

      - name: Strip binary
        run: |
          TARGET_STRIP=""
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              TARGET_STRIP="aarch64-linux-gnu-strip"
              sudo apt-get install -y binutils-aarch64-linux-gnu
              ;;
            *)
              TARGET_STRIP="strip"
              ;;
          esac
          $TARGET_STRIP target/${{ matrix.target }}/release/gmd

      - name: Package tarball
        run: |
          VERSION=${RESOLVED_TAG#v}
          STAGING="gmd-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp target/${{ matrix.target }}/release/gmd "$STAGING/"
          cp LICENSE README.md "$STAGING/"
          TARBALL="${STAGING}.tar.gz"
          tar -czf "$TARBALL" "$STAGING"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gmd-${{ matrix.target }}
          path: ${{ env.TARBALL }}
          retention-days: 1

  build-macos:
    name: Build macOS (${{ matrix.target }})
    # Both targets build on macos-latest (Apple Silicon). The x86_64
    # target cross-compiles via `rustup target add x86_64-apple-darwin`
    # — the host toolchain and `strip` both handle it natively.
    #
    # NOTE: Binaries are NOT signed or notarized. See the comment block at
    # the top of this file for instructions on adding signing later.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RESOLVED_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} --package guniweb-md

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/gmd

      - name: Package tarball
        run: |
          VERSION=${RESOLVED_TAG#v}
          STAGING="gmd-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp target/${{ matrix.target }}/release/gmd "$STAGING/"
          cp LICENSE README.md "$STAGING/"
          TARBALL="${STAGING}.tar.gz"
          tar -czf "$TARBALL" "$STAGING"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gmd-${{ matrix.target }}
          path: ${{ env.TARBALL }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RESOLVED_TAG }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create unversioned asset aliases
        working-directory: artifacts
        run: |
          # Mirror each versioned archive under a stable filename so
          # https://github.com/<owner>/<repo>/releases/latest/download/<unversioned>
          # resolves. SHA256SUMS only references the versioned canonical
          # files; the aliases are convenience pointers with identical
          # bytes.
          shopt -s nullglob
          for f in gmd-*.tar.gz; do
            unversioned=$(echo "$f" | sed -E 's/^(gmd)-[0-9]+\.[0-9]+\.[0-9]+-/\1-/')
            if [ "$f" != "$unversioned" ]; then
              cp "$f" "$unversioned"
            fi
          done

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION=${RESOLVED_TAG#v}
          if [ -f CHANGELOG.md ]; then
            # Extract the block between ## [version] and the next ## [
            BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          else
            BODY="Release ${RESOLVED_TAG}"
          fi
          printf '%s' "$BODY" > release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RESOLVED_TAG }}
          body_path: release_notes.md
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          token: ${{ secrets.GITHUB_TOKEN }}
